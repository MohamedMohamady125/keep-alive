# Builds the Windows and Mac apps automatically on GitHub.
# Push this project to GitHub, open the "Actions" tab, run "Build apps",
# and download KeepAlive-windows / KeepAlive-mac from the finished run.
# Push a tag like v1.0 to also publish them on a GitHub Release.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onefile --windowed --name KeepAlive keep_alive.py
      - uses: actions/upload-artifact@v4
        with:
          name: KeepAlive-windows
          path: dist/KeepAlive.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KeepAlive.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --windowed --name "Keep Alive" --osx-bundle-identifier com.keepalive.app keep_alive.py
      - run: cd dist && ditto -c -k --keepParent "Keep Alive.app" KeepAlive-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KeepAlive-mac
          path: dist/KeepAlive-mac.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KeepAlive-mac.zip
